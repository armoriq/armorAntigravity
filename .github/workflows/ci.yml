name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -b

      - name: Run tests
        run: bun test

  # armorOpenCode is private, so this runs only when ARMOROPENCODE_READ_TOKEN
  # (read access to that repo) is set; otherwise it reports the skip.
  core-sync:
    name: Core upstream sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Compare vendored core with armorOpenCode dev
        env:
          GH_TOKEN: ${{ secrets.ARMOROPENCODE_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::ARMOROPENCODE_READ_TOKEN is not set; run 'bun run check:core-sync --repo-dir <armorOpenCode clone>' locally."
            exit 0
          fi
          bun scripts/check-core-sync.ts

  # Code security (GitHub Advanced Security) is off for this private repo, so
  # results cannot be uploaded to code scanning. The analysis still runs, keeps
  # the SARIF as an artifact, and fails the job on any error-level finding.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: ignore

      - name: Fail on error-level findings
        run: |
          errors=$(jq '[.runs[].results[] | select((.level // "warning") == "error")] | length' codeql-results/*.sarif)
          jq -r '.runs[].results[] | "\(.level // "warning") \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif
          echo "error-level findings: $errors"
          [ "$errors" -eq 0 ]

  # Copied from armoriq/.github .github/workflows/pr-size.yml. The org ruleset
  # runs that workflow only on PRs into main and dev; this copy also covers the
  # stacked feature branches used until dev exists (#9).
  pr-size:
    name: PR size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      MAX_LINES: "1000"
      MAX_FILES: "100"
      DELETION_MAX_ADDED: "200"
    steps:
      - name: Measure PR size
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EXCLUDE: '(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|npm-shrinkwrap\.json|poetry\.lock|Pipfile\.lock|Cargo\.lock|go\.sum|Gemfile\.lock|composer\.lock|uv\.lock|flake\.lock|bun\.lockb?)$'
        run: |
          set -euo pipefail

          # --- Promotion exemption --------------------------------------------
          # Promotions bundle every commit since the last release and cannot be
          # split. Matches the branch shapes actually in use in this org.
          # Same-repo PRs only: on a fork PR the head branch name is whatever
          # the author chose in their fork, so it can never claim the exemption.
          if [ "$HEAD_REPO" = "$REPO" ] && \
             echo "$BASE" | grep -qEi '^(main|master|prod|production)$' && \
             echo "$HEAD" | grep -qEi '^(dev|develop|development|staging|stage|next|qa|uat)$|^releases?/'; then
            echo "::notice::Promotion PR ($HEAD -> $BASE), size check skipped."
            {
              echo "### PR size check: passed"
              echo ""
              echo "Promotion PR (\`$HEAD\` -> \`$BASE\`), exempt from the size cap."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- Back-merge exemption -------------------------------------------
          # A back-merge brings an integration branch up to date with main and
          # carries every commit it is missing, so like a promotion it cannot be
          # split. Same-repo PRs only, for the same reason as above.
          if [ "$HEAD_REPO" = "$REPO" ] && \
             echo "$HEAD" | grep -qEi '^(main|master)$' && \
             echo "$BASE" | grep -qEi '^(dev|develop|development|staging|stage|next|qa|uat)$'; then
            echo "::notice::Back-merge PR ($HEAD -> $BASE), size check skipped."
            {
              echo "### PR size check: passed"
              echo ""
              echo "Back-merge PR (\`$HEAD\` -> \`$BASE\`), exempt from the size cap."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- Collect changed files ------------------------------------------
          # The files API returns at most 3000 entries, however many the PR
          # really touches:
          #   https://docs.github.com/en/rest/pulls/pulls#list-pull-requests-files
          #
          # That cap cannot be treated as harmless. Exclusions are applied
          # AFTER retrieval, so a truncated set can be whittled below both
          # limits and pass (for example, a PR whose first 3000 returned entries are
          # all lockfiles would measure 0 lines across 0 files).
          #
          # This is not theoretical here: sdk-adk-test-agent-py#1 reports
          # changed_files=3602 and the endpoint returns exactly 3000.
          #
          # So compare what we retrieved against the PR's own changed_files and
          # fail closed if the picture is incomplete. Never guess at a size we
          # could not measure.
          gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | [.filename, (.additions + .deletions), .additions, .deletions] | @tsv' > files.tsv

          expected=$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files')
          retrieved=$(wc -l < files.tsv)
          echo "Files retrieved: $retrieved of $expected reported by the PR"

          if [ "$retrieved" -lt "$expected" ]; then
            {
              echo "### PR size check: failed"
              echo ""
              echo "**Cannot measure this PR.**"
              echo ""
              echo "It reports **$expected** changed files, but GitHub returned only"
              echo "**$retrieved** (the files API stops at 3000). The size cannot be"
              echo "determined, so the check fails rather than guess."
              echo ""
              echo "A PR this wide is over the $MAX_FILES file limit regardless."
              echo "Split it, or check whether build output or dependencies were"
              echo "committed by mistake."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cannot measure PR size: $expected changed files reported, only $retrieved retrievable (API caps at 3000). Failing closed."
            exit 1
          fi

          # EXCLUDE reaches awk via ENVIRON (not -v) so its backslashes survive.
          read -r total counted excluded added deleted < <(awk -F'\t' '
            $1 ~ ENVIRON["EXCLUDE"] { e += $2; next }
            NF { t += $2; c++; a += $3; d += $4 }
            END { printf "%d %d %d %d %d\n", t, c, e, a, d }' files.tsv)

          echo "Changed lines (excluding lockfiles): $total across $counted files ($added added, $deleted deleted)"

          # --- Deletion exemption ----------------------------------------------

          if [ "$deleted" -gt "$added" ] && [ "$added" -le "$DELETION_MAX_ADDED" ]; then

            echo "::notice::Deletion PR (+$added / -$deleted), size caps skipped; additions under $DELETION_MAX_ADDED."

            {

              echo "### PR size check: passed"

              echo ""

              echo "Deletion PR: **+$added / -$deleted** across $counted files."

              echo "Exempt from the size caps: it removes more than it adds and adds at most $DELETION_MAX_ADDED lines."

            } >> "$GITHUB_STEP_SUMMARY"

            exit 0

          fi

          {
            echo "### PR size check"
            echo ""
            echo "| | |"
            echo "|---|---:|"
            echo "| Changed lines counted | **$total** |"
            echo "| Line limit | $MAX_LINES |"
            echo "| Files counted | **$counted** |"
            echo "| File limit | $MAX_FILES |"
            echo "| Lockfile lines excluded | $excluded |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$total" -gt "$MAX_LINES" ] || [ "$counted" -gt "$MAX_FILES" ]; then
            {
              echo ""
              [ "$total" -gt "$MAX_LINES" ] && echo "**Over the line limit by $(( total - MAX_LINES )) lines.**"
              [ "$counted" -gt "$MAX_FILES" ] && echo "**Over the file limit by $(( counted - MAX_FILES )) files.**"
              echo ""
              echo "Split this into PRs that can each be reviewed on their own."
              echo "Pure refactors, moves and renames are usually the easiest slice to separate out."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::PR is $total changed lines across $counted files (limits: $MAX_LINES lines, $MAX_FILES files). Please split it."
            exit 1
          fi

          echo "::notice::PR size $total lines / $MAX_LINES, $counted files / $MAX_FILES: OK"
